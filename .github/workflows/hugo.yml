# Deploy Hugo site to GitHub Pages (free tier).
# Source: GitHub repo Settings → Pages → Build and deployment → GitHub Actions.
# Pin hugo-version to match Mac mini `hugo version` before first production push.
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # TODO: pin to Mac mini version, e.g. '0.139.4' — 'latest' ok for dry CI
          hugo-version: "0.168.0"
          extended: true

      - name: Generate /go/ redirect pages from links.csv (if present)
        run: |
          if [[ -f links.csv && -f scripts/generate-go-redirects.py ]]; then
            python3 scripts/generate-go-redirects.py --csv links.csv --out content/go
          elif [[ -f ../links.csv && -f scripts/generate-go-redirects.py ]]; then
            python3 scripts/generate-go-redirects.py --csv ../links.csv --out content/go
          else
            echo "No links.csv at expected paths — skipping /go/ generation (commit pre-built content/go if needed)"
          fi

      - name: Build
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
