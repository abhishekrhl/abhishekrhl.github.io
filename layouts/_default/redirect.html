<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>
  <meta name="robots" content="{{ with .Params.robots }}{{ . }}{{ else }}noindex, nofollow{{ end }}">
  {{ with .Params.redirect_to }}
  <meta http-equiv="refresh" content="0; url={{ . }}">
  <link rel="canonical" href="{{ . }}">
  {{ end }}
</head>
<body>
  <main>
    <h1>Redirecting…</h1>
    {{ with .Params.redirect_to }}
    <p>If you are not redirected automatically,
      <a href="{{ . }}" rel="noopener noreferrer sponsored">continue to the destination</a>.
    </p>
    {{ end }}
    {{ with .Params.note }}<p><small>{{ . }}</small></p>{{ end }}
  </main>
</body>
</html>
